<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #000; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  img { max-width: 100vw; }
</style>
</head>
<body>
  <img id="wf" />
  <script>
    const name = decodeURIComponent((location.hash || '#02-MainMenuScreen.png').slice(1));
    document.getElementById('wf').src = name;
    document.title = name;
  </script>
</body>
</html>
