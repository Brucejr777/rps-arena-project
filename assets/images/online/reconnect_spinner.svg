<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Track circle -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="#1E293B" stroke-width="5"/>
  <!-- Spinner arc (blue accent) -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="#2563EB" stroke-width="5"
          stroke-linecap="round"
          stroke-dasharray="60 140"
          transform="rotate(-90 40 40)">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 40 40" to="360 40 40"
                      dur="1s" repeatCount="indefinite"/>
  </circle>
  <!-- Center arrow -->
  <path d="M34 40 L40 34 L46 40 M40 34 L40 50" stroke="#2563EB" stroke-width="3"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
